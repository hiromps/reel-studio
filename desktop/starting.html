<!doctype html>
<html lang="ja">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>Reel Studioを起動しています</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f4f1; color:#232723; font:16px/1.7 system-ui,sans-serif; }
  main { text-align:center; padding:40px; }
  h1 { font-size:30px; margin:0 0 12px; }
  .mark { width:80px; height:80px; display:block; margin:0 auto 18px; }
  p { color:#515951; }
  progress { width:260px; height:8px; accent-color:#1a73ff; }
</style>
<main><img class="mark" src="reel-studio.svg" alt=""><h1>Reel Studio</h1><p role="status" aria-live="polite">動画編集の準備をしています…</p><progress aria-label="起動の進行状況"></progress><p>まもなく編集画面が開きます。</p></main>
</html>
